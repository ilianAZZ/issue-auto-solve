# Global configuration. Everything here is a default: any repository can
# override it in its own .issue-auto-solve.yml.

poll_interval_seconds: 120

# failed/skipped tasks are re-checked against GitHub (did a human merge or close it since?)
# on this interval instead of on every poll tick — re-checking the whole failed/skipped
# backlog every tick scales with total task history instead of active work, and is what
# exhausted the GitHub rate limit permanently once the backlog grew past ~80 tasks.
reconcile_terminal_interval_seconds: 300

max_concurrent_runs: 2

# false: issue-auto-solve watches, syncs and shows everything but never starts a run.
# The safe way to plug a new repository in and see what it would pick up.
dispatch_enabled: true

# Environment variables a repository may ask for through runtime.env. Anything not listed
# here is refused, so a .issue-auto-solve.yml cannot help itself to the orchestrator's
# secrets. Empty means none.
allow_env: []

# Self-update: issue-auto-solve is itself a container. With this on, it checks the image
# it was started from for a newer digest and, when one shows up and nothing is running,
# recreates itself on it — no "docker pull && up -d" by hand. Off by default; toggle it
# from the dashboard's Updates panel too, which is checked first on every boot.
auto_update:
  enabled: false
  check_interval_hours: 24

defaults:
  base_branch: main
  branch_pattern: "agent/issue-{{number}}"
  config_path: .issue-auto-solve.yml
  labels:
    exclude: []
    waiting: needs-human-input
  selection:
    order: oldest        # oldest | newest | priority_labels
    priority_labels: []
    # Public repository? Nothing is worked on until a maintainer approves it.
    # Adding a label requires triage permission, so the label is the gate.
    require_label: null            # e.g. "approved"
    trusted_associations: []       # e.g. [OWNER, MEMBER, COLLABORATOR]
  limits:
    max_concurrent_runs: 1
    timeout_minutes: 45
    max_runs_per_task: 2
  runtime:
    image: node:24-slim
    # Mounting the Docker socket is root on the host. Operator-only: a repository cannot
    # turn this on from its own .issue-auto-solve.yml.
    docker_socket: false
    env: []
    setup:
      # `gh` is required: prompts/default.md and prompts/bootstrap.md both shell out to it
      # (issue comments, pull requests, label/branch lookups).
      - apt-get update && apt-get install -y --no-install-recommends git curl ca-certificates gnupg
      - install -d -m 755 /etc/apt/keyrings && curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg -o /etc/apt/keyrings/githubcli-archive-keyring.gpg && chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg && echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/github-cli.list && apt-get update && apt-get install -y --no-install-recommends gh
      - npm install -g @anthropic-ai/claude-code
    # Extra paths inside the image handed to the non-root run user, alongside /workspace.
    # A custom image can bake in a toolchain (e.g. an SDK cache) owned by root; the agent
    # has no sudo once handed off, so anything it needs to write there must be listed here.
    writable_paths: []
  preflight: []
  checks: []
  prompt:
    file: null           # path inside the target repo, e.g. .issue-auto-solve/prompt.md
    variables: {}

repositories:
  - repo: owner/name
    enabled: false
