# Global configuration. Everything here is a default: any repository can
# override it in its own .issue-auto-solve.yml.

poll_interval_seconds: 120
max_concurrent_runs: 2

# false: issue-auto-solve watches, syncs and shows everything but never starts a run.
# The safe way to plug a new repository in and see what it would pick up.
dispatch_enabled: true

# Environment variables a repository may ask for through runtime.env. Anything not listed
# here is refused, so a .issue-auto-solve.yml cannot help itself to the orchestrator's
# secrets. Empty means none.
allow_env: []

defaults:
  base_branch: main
  branch_pattern: "agent/issue-{{number}}"
  config_path: .issue-auto-solve.yml
  labels:
    exclude: []
    waiting: needs-human-input
  selection:
    order: oldest        # oldest | newest | priority_labels
    priority_labels: []
    # Public repository? Nothing is worked on until a maintainer approves it.
    # Adding a label requires triage permission, so the label is the gate.
    require_label: null            # e.g. "approved"
    trusted_associations: []       # e.g. [OWNER, MEMBER, COLLABORATOR]
  limits:
    max_concurrent_runs: 1
    timeout_minutes: 45
    max_runs_per_task: 2
  runtime:
    image: node:24-slim
    # Mounting the Docker socket is root on the host. Operator-only: a repository cannot
    # turn this on from its own .issue-auto-solve.yml.
    docker_socket: false
    env: []
    setup: []
  preflight: []
  checks: []
  prompt:
    file: null           # path inside the target repo, e.g. .issue-auto-solve/prompt.md
    variables: {}

repositories:
  - repo: owner/name
    enabled: false
